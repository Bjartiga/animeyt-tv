<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>AnimeYT TV</title>

    <!-- CSP Permisiva para Tizen Smart TV y reproducción de video -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src * 'self' 'unsafe-inline' 'unsafe-eval' data: blob:;
                   frame-src *;
                   media-src * blob: data:;
                   img-src * data: blob:;
                   connect-src *;
                   style-src * 'self' 'unsafe-inline';">

    <link rel="stylesheet" href="css/app.css">
</head>
<body>

    <!-- Header: transparente sobre el billboard -->
    <header id="app-header" class="app-header">
        <div class="brand">
            <span class="brand-mark">A</span>
            <span class="brand-title">AnimeYT</span>
        </div>

        <nav class="header-nav">
            <button type="button" class="header-nav-btn is-active" data-focusable="true" data-action="nav" data-view="home">Inicio</button>
            <button type="button" class="header-nav-btn" data-focusable="true" data-action="nav" data-view="search">Buscar <i class="dot red"></i></button>
            <button type="button" class="header-nav-btn" data-focusable="true" data-action="nav" data-view="catalog">Catálogo <i class="dot green"></i></button>
            <button type="button" class="header-nav-btn" data-focusable="true" data-action="nav" data-view="mylist">Mi lista</button>
            <button type="button" class="header-nav-btn" data-focusable="true" data-action="nav" data-view="settings">Ajustes <i class="dot yellow"></i></button>
        </nav>
    </header>

    <main id="app-main" class="app-main">

        <!-- 1. Inicio: billboard + filas -->
        <section id="view-home" class="view view-home">
            <div id="home-content"></div>
        </section>

        <!-- 2. Búsqueda -->
        <section id="view-search" class="view view-page hidden">
            <div class="search-bar">
                <input type="search" id="search-input" class="search-input" placeholder="Buscar anime por nombre..." autocomplete="off" data-focusable="true" />
                <button type="button" id="search-submit-btn" class="btn btn-primary" data-focusable="true">Buscar</button>
            </div>
            <h2 id="search-results-count" class="page-subtitle">Escribe al menos 3 letras</h2>
            <div id="search-results-grid" class="poster-grid"></div>
        </section>

        <!-- 3. Catálogo con filtros (los filtros se cargan desde el sitio) -->
        <section id="view-catalog" class="view view-page hidden">
            <form id="catalog-filters-form" class="filter-bar" onsubmit="return false;"></form>
            <div id="catalog-results-grid" class="poster-grid"></div>
            <div id="catalog-pagination" class="pagination"></div>
        </section>

        <!-- 4. Ficha del anime -->
        <section id="view-anime" class="view hidden">
            <div id="anime-detail-content"></div>
        </section>

        <!-- 5. Mi lista -->
        <section id="view-mylist" class="view view-page hidden">
            <h1 class="page-title">Mi lista</h1>
            <div id="mylist-content"></div>
        </section>

        <!-- 6. Reproductor -->
        <section id="view-watch" class="view hidden">
            <div id="player-viewport" class="player-viewport"></div>

            <div id="player-buffering" class="player-buffering">
                <div class="spinner"></div>
            </div>

            <div id="player-osd" class="player-osd">
                <div class="osd-top">
                    <h2 id="player-title">Cargando episodio...</h2>
                    <span id="player-current-server" class="osd-server">Servidor: cargando...</span>
                </div>

                <div class="osd-bottom">
                    <div id="player-progress" class="osd-progress">
                        <div class="osd-progress-track">
                            <div id="player-progress-fill" class="osd-progress-fill"></div>
                        </div>
                        <span id="player-progress-time" class="osd-progress-time">0:00 / 0:00</span>
                    </div>

                    <div class="osd-hints">
                        <span><b>OK</b> Pausa</span>
                        <span><b>◀ ▶</b> 10s</span>
                        <span><i class="dot green"></i> Saltar intro</span>
                        <span><b>▼</b> Servidores</span>
                        <span><b>CH+ / CH−</b> Episodio</span>
                        <span><i class="dot blue"></i> Visto</span>
                    </div>
                </div>
            </div>

            <div id="player-next" class="player-next">
                <span id="player-next-label" class="player-next-label">Siguiente episodio</span>
                <span class="player-next-hint"><b>OK</b> ver ahora · <b>↩</b> cancelar</span>
            </div>

            <!-- Panel de servidores (▼ o amarillo para abrir, ▲ o ↩ para cerrar) -->
            <div id="player-server-bar" class="player-server-bar" data-nav-scope>
                <div class="server-bar-title">Servidor de video <span>▲ cerrar</span></div>
                <div id="player-server-list" class="player-server-list"></div>
            </div>

            <div id="player-toast" class="app-toast"></div>
        </section>

        <!-- 7. Ajustes -->
        <section id="view-settings" class="view view-page hidden">
            <h1 class="page-title">Ajustes</h1>
            <div id="settings-content"></div>
        </section>

    </main>

    <div id="global-loader" class="global-loader hidden">
        <div class="spinner"></div>
        <p id="loader-text" class="loader-text">Cargando...</p>
    </div>

    <script src="js/keys.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/scraper.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/picker.js"></script>
    <script src="js/player.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
